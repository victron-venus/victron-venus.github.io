# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Quality gate
'on':
  pull_request: {}
  merge_group: {}
  workflow_call: {}
  push:
    branches:
      - main
  schedule:
    - cron: 35 5 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  workflow-contracts:
    name: CI configuration contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt
      - run: python3 scripts/workflow_contracts.py
      - run: python3 -m unittest discover -s .github/workflow-tests -p 'test_*.py'
  check-0:
    needs: workflow-contracts
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-1:
    needs: workflow-contracts
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-2:
    needs: workflow-contracts
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
  gate:
    name: CI gate
    needs:
      - workflow-contracts
      - check-0
      - check-1
      - check-2
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Require every validation workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PY
